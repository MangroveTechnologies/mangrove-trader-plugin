name: Catalog

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and prepare exact source
        run: |
          python scripts/prepare_release.py --commit "$GITHUB_SHA" --output "$RUNNER_TEMP/trader-release"
          python scripts/prepare_release.py --commit "$GITHUB_SHA" --output "$RUNNER_TEMP/trader-release"
